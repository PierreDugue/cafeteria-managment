{{define "layout"}}<!doctype html>
<html lang="{{.L.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}} · {{.L.T "app.title"}}</title>
  <link rel="stylesheet" href="/static/style.css">
  {{block "scripts" .}}{{end}}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">{{.L.T "app.title"}}</a>
      <nav>
        <a href="/" {{if eq .Active "home"}}aria-current="page"{{end}}>{{.L.T "nav.home"}}</a>
        <a href="/import" {{if eq .Active "import"}}aria-current="page"{{end}}>{{.L.T "nav.import"}}</a>
        <a href="/children" {{if eq .Active "children"}}aria-current="page"{{end}}>{{.L.T "nav.children"}}</a>
        <a href="/templates" {{if eq .Active "templates"}}aria-current="page"{{end}}>{{.L.T "nav.templates"}}</a>
        <a href="/history" {{if eq .Active "history"}}aria-current="page"{{end}}>{{.L.T "nav.history"}}</a>
      </nav>
    </div>
  </header>
  <main>
    {{template "content" .}}
  </main>
  <footer>v{{.Version}}</footer>
</body>
</html>{{end}}
