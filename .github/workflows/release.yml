# Builds the Windows and macOS binaries and publishes a GitHub Release
# when a version tag is pushed:
#
#   git tag v0.1.0
#   git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      # Pure Go (no CGO): all platforms are cross-compiled from Linux.
      - name: Build
        run: make build-all VERSION="${GITHUB_REF_NAME}"

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
